<svg width="260" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="100 28 260 260" role="img" aria-label="hopper mark">
  <title>hopper</title>
  <style>
  /* Self-contained: this file animates on its own, no host stylesheet. */
  svg { color: #1f2937; }
  [class^="anim-"] { animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
  .anim-hopper-settle { animation-name: hopper-settle; animation-duration: 900ms; animation-timing-function: cubic-bezier(.34,1.4,.64,1); transform-box: view-box; transform-origin: 0 0; }
  @keyframes hopper-settle { 0%,4%{transform:translateY(0)} 34%{transform:translateY(-26px)} 72%{transform:translateY(4px)} 88%,100%{transform:translateY(0)} }
  @media (prefers-color-scheme: dark) {
    svg { color: #e5e7eb; }
  }
  @media (prefers-reduced-motion: reduce) { [class^="anim-"] { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="hopper-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#3b4250"/>
    </linearGradient>
  </defs>
  <g class="anim-hopper-settle">
    <rect x="150" y="40" width="22" height="22" fill="#f59e0b"/>
    <rect x="196" y="58" width="22" height="22" fill="#22c55e"/>
    <rect x="242" y="44" width="22" height="22" fill="#38bdf8"/>
    <rect x="288" y="60" width="22" height="22" fill="#a78bfa"/>
  </g>
  <g stroke="#11151c" stroke-width="3">
    <rect x="120" y="96" width="220" height="34" fill="url(#hopper-iron)"/>
    <rect x="120" y="96" width="220" height="10" fill="#7c8595"/>
    <rect x="140" y="106" width="180" height="14" fill="#2a313c"/>
  </g>
  <g fill="url(#hopper-iron)" stroke="#11151c" stroke-width="3">
    <rect x="138" y="130" width="184" height="30"/>
    <rect x="160" y="160" width="140" height="30"/>
    <rect x="186" y="190" width="88" height="30"/>
  </g>
  <g fill="#3b4250" stroke="#11151c" stroke-width="3">
    <rect x="206" y="220" width="48" height="36"/>
    <rect x="220" y="256" width="20" height="20" fill="#1b2230"/>
  </g>
</svg>
