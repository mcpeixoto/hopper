<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#1b2230"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#3b4250"/>
    </linearGradient>
  </defs>

  <!-- slab background -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <!-- subtle pixel grid -->
  <g fill="#ffffff" opacity="0.025">
    <rect x="0"   y="0" width="40" height="340"/>
    <rect x="80"  y="0" width="40" height="340"/>
    <rect x="160" y="0" width="40" height="340"/>
    <rect x="240" y="0" width="40" height="340"/>
  </g>

  <!-- ===== pixel hopper icon (original art, not Mojang sprites) ===== -->
  <!-- jobs (colored item blocks) dropping into the hopper -->
  <g>
    <rect x="150" y="40" width="22" height="22" fill="#f59e0b"/>
    <rect x="196" y="58" width="22" height="22" fill="#22c55e"/>
    <rect x="242" y="44" width="22" height="22" fill="#38bdf8"/>
    <rect x="288" y="60" width="22" height="22" fill="#a78bfa"/>
  </g>

  <!-- collection basin (wide rim) -->
  <g stroke="#11151c" stroke-width="3">
    <rect x="120" y="96"  width="220" height="34" fill="url(#iron)"/>
    <rect x="120" y="96"  width="220" height="10" fill="#7c8595"/>
    <!-- inner hollow -->
    <rect x="140" y="106" width="180" height="14" fill="#2a313c"/>
  </g>

  <!-- funnel body (stepped pixel taper) -->
  <g fill="url(#iron)" stroke="#11151c" stroke-width="3">
    <rect x="138" y="130" width="184" height="30"/>
    <rect x="160" y="160" width="140" height="30"/>
    <rect x="186" y="190" width="88"  height="30"/>
  </g>
  <!-- spout -->
  <g fill="#3b4250" stroke="#11151c" stroke-width="3">
    <rect x="206" y="220" width="48" height="36"/>
    <rect x="220" y="256" width="20" height="20" fill="#1b2230"/>
  </g>

  <!-- ===== wordmark ===== -->
  <text x="400" y="150" font-size="104" font-weight="800" fill="#f3f4f6" letter-spacing="2">HOPPER</text>
  <text x="404" y="200" font-size="30" font-weight="500" fill="#9aa4b2">Funnel compute jobs to whatever node is free.</text>

  <!-- node chips -->
  <g font-size="20" font-weight="600">
    <rect x="404" y="232" width="150" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="426" cy="252" r="6" fill="#22c55e"/>
    <text x="442" y="259" fill="#cbd5e1">laptop</text>

    <rect x="566" y="232" width="120" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="588" cy="252" r="6" fill="#22c55e"/>
    <text x="604" y="259" fill="#cbd5e1">vps</text>

    <rect x="698" y="232" width="190" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="720" cy="252" r="6" fill="#64748b"/>
    <text x="736" y="259" fill="#cbd5e1">+ any node</text>
  </g>

  <!-- no-k8s badge -->
  <g transform="translate(980,150)">
    <rect x="0" y="-44" width="190" height="64" rx="12" fill="#0b3b2e" stroke="#10b981" stroke-width="2"/>
    <text x="95" y="-16" font-size="18" font-weight="700" fill="#34d399" text-anchor="middle">NO KUBERNETES</text>
    <text x="95" y="8"  font-size="14" font-weight="500" fill="#9aa4b2" text-anchor="middle">just a binary + docker</text>
  </g>
</svg>
